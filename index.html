<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Wheel</title>
<style>
  :root{
    --bg:#14161c; --panel:#1d2029; --panel2:#262a35; --text:#eef0f5; --muted:#9aa1b2;
    --accent:#ffcc4d; --danger:#ff6b6b; --ok:#5fd38d; --border:#323746;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:22px;margin:0;letter-spacing:.2px}
  .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}
  .dot.on{background:var(--ok)}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .stage{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .wheelbox{position:relative;width:100%;max-width:560px;aspect-ratio:1}
  canvas{width:100%;height:100%;display:block}
  .pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;
    border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--accent);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));z-index:2}
  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16%;aspect-ratio:1;border-radius:50%;
    background:var(--panel);border:4px solid var(--accent);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:clamp(12px,2.4vw,18px);cursor:pointer;color:var(--text);user-select:none}
  .hub[aria-disabled="true"]{cursor:default;opacity:.7}
  button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer}
  button:hover{border-color:#4a5166}
  button:disabled{opacity:.5;cursor:default}
  .spinbtn{background:var(--accent);color:#1b1b1b;border:none;font-weight:700;font-size:18px;padding:12px 40px;border-radius:12px}
  .result{min-height:56px;text-align:center}
  .result .win{font-size:26px;font-weight:800;color:var(--accent)}
  .result .meta{color:var(--muted);font-size:13px}
  .side{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}
  .card h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 10px}
  input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .row{display:flex;gap:8px}
  .row input{flex:1;min-width:0}
  ul{list-style:none;margin:10px 0 0;padding:0;max-height:360px;overflow:auto}
  li{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border)}
  li:last-child{border-bottom:none}
  li .sw{width:12px;height:12px;border-radius:3px;flex:none}
  li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li button{padding:2px 9px;border-radius:8px;background:transparent;color:var(--muted)}
  li button:hover{color:var(--danger);border-color:var(--danger)}
  .muted{color:var(--muted);font-size:13px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
  textarea{min-height:90px;margin-top:8px;resize:vertical}
  .small{font-size:13px;padding:6px 10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 Game Wheel</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <div class="grid">
    <section class="stage">
      <div class="wheelbox">
        <div class="pointer"></div>
        <canvas id="wheel" width="1000" height="1000"></canvas>
        <div class="hub" id="hub" role="button" tabindex="0">SPIN</div>
      </div>
      <button class="spinbtn" id="spinBtn">Spin</button>
      <div class="result" id="result"><div class="meta">Nobody has spun yet.</div></div>
    </section>

    <aside class="side">
      <div class="card">
        <h2>Your name</h2>
        <input id="nick" maxlength="24" placeholder="So others see who spun">
      </div>
      <div class="card">
        <h2>Games <span id="count" class="muted"></span></h2>
        <form class="row" id="addForm">
          <input id="newItem" maxlength="40" placeholder="Add a game…" autocomplete="off">
          <button type="submit">Add</button>
        </form>
        <ul id="list"></ul>
        <details>
          <summary>Paste many at once</summary>
          <textarea id="bulk" placeholder="One game per line"></textarea>
          <div class="row" style="margin-top:8px">
            <button class="small" id="bulkAdd">Add all</button>
            <button class="small" id="bulkReplace">Replace list</button>
          </div>
        </details>
      </div>
      <p class="muted">Everyone with this link sees the same list and the same spin. Changes sync instantly.</p>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
  // ---- Settings -----------------------------------------------------------
  // Free public MQTT broker: relays messages between everyone's browsers and
  // keeps the latest list + spin ("retained") for people who join later.
  const BROKER = "wss://broker.emqx.io:8084/mqtt";
  // Private room id. Change it (or open the page with ?room=something) for a separate wheel.
  const ROOM = new URLSearchParams(location.search).get("room") || "29cb17bb6f02";
  const BASE = "gamewheel-v1/" + ROOM;
  const T_ITEMS = BASE + "/items", T_SPIN = BASE + "/spin";
  const SPIN_MS = 6000, MAX_ITEMS = 80, MAX_LEN = 40;
  const COLORS = ["#ef476f","#f78c6b","#ffd166","#83d483","#06d6a0","#0cb0a9","#118ab2","#5b7bd5","#8e6bd8","#c86bd8","#e56b9e","#a3a948"];

  // ---- State --------------------------------------------------------------
  let items = [];           // shared list
  let lastSpin = null;      // last spin message
  let rotation = 0;         // current wheel rotation (radians, clockwise)
  let anim = null;          // running animation
  let connected = false;

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");
  const nick = $("nick");
  try { nick.value = localStorage.getItem("gw-nick") || ""; } catch {}
  nick.addEventListener("input", () => { try { localStorage.setItem("gw-nick", nick.value.trim()); } catch {} });
  const myName = () => nick.value.trim().slice(0, 24) || "Someone";

  const clean = s => String(s ?? "").replace(/\s+/g, " ").trim().slice(0, MAX_LEN);
  const validItems = arr => Array.isArray(arr) ? arr.map(clean).filter(Boolean).slice(0, MAX_ITEMS) : null;

  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }

  // ---- Drawing ------------------------------------------------------------
  function draw(list, rot){
    const W = canvas.width, c = W/2, R = c - 12;
    ctx.clearRect(0,0,W,W);
    ctx.save(); ctx.translate(c,c);
    if (!list.length){
      ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fillStyle="#262a35"; ctx.fill();
      ctx.fillStyle="#9aa1b2"; ctx.font="600 40px system-ui,sans-serif"; ctx.textAlign="center";
      ctx.fillText("Add some games →", 0, -R*0.45); ctx.restore(); return;
    }
    const n = list.length, seg = Math.PI*2/n;
    ctx.rotate(rot);
    for (let i=0;i<n;i++){
      // segment i spans [i*seg,(i+1)*seg] clockwise from 12 o'clock
      const a0 = -Math.PI/2 + i*seg, a1 = a0 + seg;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
      ctx.fillStyle = colorFor(i, n); ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=3; ctx.stroke();
      ctx.save(); ctx.rotate(a0 + seg/2);
      ctx.fillStyle="#15171d"; ctx.textAlign="right"; ctx.textBaseline="middle";
      const size = Math.max(18, Math.min(46, seg*R*0.55));
      ctx.font = `700 ${size}px system-ui,sans-serif`;
      let label = list[i]; const maxW = R*0.72;
      while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0,-2) + "…";
      if (label !== list[i] && !label.endsWith("…")) label += "…";
      ctx.fillText(label, R-24, 0);
      ctx.restore();
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(c,c,R,0,Math.PI*2); ctx.lineWidth=10; ctx.strokeStyle="#ffcc4d"; ctx.stroke();
  }
  function colorFor(i,n){ let col = COLORS[i % COLORS.length]; if (n>1 && i===n-1 && i%COLORS.length===0) col = COLORS[5]; return col; }

  function render(){
    if (anim) return; // animation draws its own frames
    draw(items, rotation);
  }

  function renderList(){
    const ul = $("list"); ul.textContent = "";
    items.forEach((it, i) => {
      const li = document.createElement("li");
      const sw = document.createElement("span"); sw.className="sw"; sw.style.background = colorFor(i, items.length);
      const nm = document.createElement("span"); nm.className="name"; nm.textContent = it; nm.title = it;
      const rm = document.createElement("button"); rm.textContent="✕"; rm.title="Remove"; rm.setAttribute("aria-label","Remove "+it);
      rm.onclick = () => setItems(items.filter((_, j) => j !== i), `removed ${it}`);
      li.append(sw, nm, rm); ul.append(li);
    });
    $("count").textContent = items.length ? `(${items.length})` : "";
    updateButtons();
  }

  function updateButtons(){
    const can = connected && items.length >= 2 && !anim;
    $("spinBtn").disabled = !can;
    $("hub").setAttribute("aria-disabled", String(!can));
  }

  function showResult(spin, live){
    const box = $("result"); box.textContent = "";
    if (!spin) { const m=document.createElement("div"); m.className="meta"; m.textContent="Nobody has spun yet."; box.append(m); return; }
    const w = document.createElement("div"); w.className="win"; w.textContent = spin.items[spin.winner];
    const m = document.createElement("div"); m.className="meta";
    const when = new Date(spin.ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    m.textContent = (live ? "" : "Last spin · ") + `spun by ${spin.by} at ${when}`;
    box.append(w, m);
  }

  // ---- Spin animation (identical on every screen) -------------------------
  function finalRotation(spin){
    const n = spin.items.length, seg = Math.PI*2/n;
    const a = (spin.winner + spin.offset) * seg;             // wheel angle that must sit under the pointer
    const TAU = Math.PI*2;
    const delta = (((-a - spin.start) % TAU) + TAU) % TAU;    // extra turn to land there
    return spin.start + spin.turns*TAU + delta;
  }
  const ease = t => 1 - Math.pow(1 - t, 4);

  function playSpin(spin){
    if (anim) cancelAnimationFrame(anim.raf);
    const from = spin.start, to = finalRotation(spin), t0 = performance.now();
    $("result").innerHTML = '<div class="meta">Spinning…</div>';
    anim = {};
    updateButtons();
    const step = now => {
      const t = Math.min(1, (now - t0) / SPIN_MS);
      rotation = from + (to - from) * ease(t);
      draw(spin.items, rotation);
      if (t < 1) anim.raf = requestAnimationFrame(step);
      else { anim = null; rotation = to % (Math.PI*2); showResult(spin, true); render(); updateButtons(); }
    };
    anim.raf = requestAnimationFrame(step);
  }

  function doSpin(){
    if ($("spinBtn").disabled) return;
    const n = items.length;
    const spin = {
      id: Math.random().toString(36).slice(2),
      items: items.slice(),
      winner: Math.floor(Math.random()*n),
      offset: 0.15 + Math.random()*0.7,     // where inside the slice it stops
      turns: 5 + Math.floor(Math.random()*3),
      start: ((rotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2),
      by: myName(),
      ts: Date.now()
    };
    publish(T_SPIN, spin);
  }

  // ---- Shared list edits --------------------------------------------------
  function setItems(next, what){
    next = validItems(next) || [];
    publish(T_ITEMS, { items: next, by: myName(), ts: Date.now() });
    if (what) toast(what.charAt(0).toUpperCase() + what.slice(1));
  }
  function addMany(arr){
    const lower = new Set(items.map(x => x.toLowerCase()));
    const add = arr.map(clean).filter(x => x && !lower.has(x.toLowerCase()) && (lower.add(x.toLowerCase()), true));
    if (!add.length) return toast("Already on the wheel");
    if (items.length + add.length > MAX_ITEMS) return toast(`Max ${MAX_ITEMS} games`);
    setItems(items.concat(add), add.length === 1 ? `added ${add[0]}` : `added ${add.length} games`);
  }

  $("addForm").addEventListener("submit", e => { e.preventDefault(); const v=$("newItem").value; if (clean(v)) { addMany([v]); $("newItem").value=""; } });
  $("bulkAdd").onclick = () => { addMany($("bulk").value.split("\n")); $("bulk").value=""; };
  $("bulkReplace").onclick = () => {
    const list = validItems($("bulk").value.split("\n")) || [];
    if (!list.length) return toast("Paste some games first");
    if (!confirm(`Replace the whole list with ${list.length} games for everyone?`)) return;
    setItems([...new Map(list.map(x=>[x.toLowerCase(),x])).values()], "list replaced"); $("bulk").value="";
  };
  $("spinBtn").onclick = doSpin;
  $("hub").onclick = doSpin;
  $("hub").onkeydown = e => { if (e.key==="Enter"||e.key===" ") { e.preventDefault(); doSpin(); } };

  // ---- Networking ---------------------------------------------------------
  let client = null;
  function publish(topic, obj){
    if (!client || !connected) return toast("Not connected yet…");
    client.publish(topic, JSON.stringify(obj), { qos: 1, retain: true });
  }
  function setStatus(on, text){ connected = on; $("dot").classList.toggle("on", on); $("statusText").textContent = text; updateButtons(); }

  function onMessage(topic, payload, packet){
    let msg; try { msg = JSON.parse(payload.toString()); } catch { return; }
    if (topic === T_ITEMS){
      const list = validItems(msg && msg.items); if (!list) return;
      items = list; renderList(); render();
    } else if (topic === T_SPIN){
      const s = msg;
      const list = validItems(s && s.items);
      if (!list || list.length < 1 || !Number.isInteger(s.winner) || s.winner < 0 || s.winner >= list.length) return;
      const spin = { id:String(s.id||""), items:list, winner:s.winner,
        offset: Math.min(0.95, Math.max(0.05, +s.offset || 0.5)),
        turns: Math.min(10, Math.max(1, Math.floor(+s.turns || 5))),
        start: Number.isFinite(+s.start) ? +s.start : 0,
        by: clean(s.by).slice(0,24) || "Someone", ts: +s.ts || Date.now() };
      if (lastSpin && lastSpin.id === spin.id) return;
      lastSpin = spin;
      if (packet && packet.retain){            // joined late: just show where it stopped
        rotation = finalRotation(spin) % (Math.PI*2); showResult(spin, false); render();
      } else {
        playSpin(spin);
      }
    }
  }

  function connect(){
    if (!window.mqtt){ setStatus(false, "Couldn't load sync library"); return; }
    client = mqtt.connect(BROKER, {
      clientId: "gw_" + Math.random().toString(16).slice(2, 10),
      clean: true, reconnectPeriod: 2000, connectTimeout: 10000, keepalive: 30
    });
    client.on("connect", () => {
      setStatus(true, "Live");
      client.subscribe([T_ITEMS, T_SPIN], { qos: 1 });
    });
    client.on("reconnect", () => setStatus(false, "Reconnecting…"));
    client.on("offline", () => setStatus(false, "Offline – retrying…"));
    client.on("error", () => setStatus(false, "Connection problem – retrying…"));
    client.on("message", onMessage);
  }

  renderList(); render(); connect();
  window.__gw = { get items(){return items;}, get lastSpin(){return lastSpin;}, get spinning(){return !!anim;} };
})();
</script>
</body>
</html>
